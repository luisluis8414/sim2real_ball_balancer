# Copy this directory to profiles/<your-platform> before first-time setup.
baudrate = 1000000
min_voltage = 4.5
max_temperature = 65
speed = 600
acceleration = 30
retries = 3
tolerance = 8
step = 20
max_lag = 60
home_offset = 400
max_offset = 1780

[[servo]]
name = "axis_1"
id = 1

[[servo]]
name = "axis_2"
id = 2

[[servo]]
name = "axis_3"
id = 3

