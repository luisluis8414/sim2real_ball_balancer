# REFERENCE ONLY: measured on the repository author's physical platform-v2.
# Do not control another rig with these values. Copy profiles/example to a new
# profile and calibrate that hardware. This profile remains for comparison with
# the recorded simulation and identification results.
# Human-maintained definition of that physical platform.
# Generated encoder positions live in calibration.toml next to this file.
# port = "/dev/serial/by-id/..."  # omit to auto-detect one adapter

baudrate = 1000000
min_voltage = 4.5
max_temperature = 65
speed = 2650
acceleration = 100
retries = 3
tolerance = 8
step = 20
max_lag = 60

# Every axis shares one geometry. Setup measures only its encoder value at the
# lower reference; home and max are derived from that value.
home_offset = 400
max_offset = 1780

[[servo]]
name = "axis_1"
id = 1

[[servo]]
name = "axis_2"
id = 2

[[servo]]
name = "axis_3"
id = 3
