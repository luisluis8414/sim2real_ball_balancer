[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballbal"
version = "0.1.0"
description = "Feetech STS3215 servo control for the ball balancer"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "tomlkit>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vision = ["opencv-python>=4.9", "numpy>=1.26"]
analysis = ["numpy>=1.26", "scipy>=1.13"]

[project.scripts]
ballbal = "ballbal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ballbal.hardware.vendor" = ["LICENSE.ftservo", "SDK_COMMIT.txt"]
"ballbal.simulation" = ["params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
